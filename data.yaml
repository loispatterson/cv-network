# Career network: roles, the things you did in them, and the links between.
#
# Three lists. Keep ids short, lowercase and stable, because the links refer to
# them by id and renaming one breaks every link that points at it.
#
#   roles   the jobs. Circle size comes from months, which is computed from the
#           dates, so you never type a size.
#   nodes   everything a role can connect to: skills, tools and domains.
#   links   which role used which node, and how central it was.
#
# To add something: put it in `nodes` once, then add a line to `links` for every
# role it belongs to. A node with no links will not be drawn.
#
# `first: true` marks where you first used something. Useful because it lets the
# diagram show origin, which is the interesting part of a long career: the SQL
# starts at the ONS in 1999 and never stops.

# ---------------------------------------------------------------- roles ------
# kind: work | study   (study lets the degrees sit in the same graph if you want)
# strength on a link is 1 to 3: 1 touched it, 2 used it regularly, 3 central to
# the job. It drives line thickness, so be sparing with 3s or everything shouts.

roles:
  - id: education
    company: Education
    title: Degrees
    kind: study
    start: 1995-09
    end: 2001-09
    years: 4               # actual time studying, not the span: 3 for the BSc, 1 for the MSc
    mid: 1998.5
    location: Leicester and Bristol

  - id: ons
    company: Office for National Statistics
    title: Retail Prices Index
    start: 1999-02
    end: 2000-08
    # The exact months are inferred, not recorded. What is known is 1999 to
    # 2000, somewhere between 18 months and 2 years, ending before the Bristol
    # MSc began in September 2000. Either way it rounds to 2.
    location: United Kingdom

  - id: steer
    company: Steer Davies Gleave
    title: Transport modelling
    start: 2001-09          # straight out of the Bristol MSc, which ran 2000 to 2001
    end: 2003-01
    location: London

  - id: cerc
    company: CERC
    title: Scientific software
    start: 2003-01
    end: 2006-01
    location: Cambridge

  - id: source
    company: Source Medical
    title: Developer
    start: 2006-01
    end: 2008-01
    location: Connecticut, USA

  - id: fluidone
    company: FluidOne
    title: Developer, then Head of Software Development
    start: 2008-06
    end: 2018-01
    location: London

  - id: motherlode
    company: Motherlode Media
    title: Technical Project Manager
    start: 2018-06
    end: 2022-02
    location: Remote, France

  - id: ggmr
    company: GGMR
    title: Technical Project Manager
    employment: fixed-term contract    # four months was the length of the engagement,
                                       # not a short stay in a permanent job
    start: 2022-03
    end: 2022-06
    years: 0.3            # four months. The one role too short to round up to a year.
    location: Remote, France

  - id: sweepbright
    company: SweepBright
    title: Technical Product Manager
    start: 2022-11
    end: 2024-12
    location: Remote, France

  - id: personal
    company: Personal training
    title: Self-directed learning and side projects
    kind: study
    start: 2019-01
    end: null
    location: Chamonix

  - id: liza
    company: Liza.network
    title: Product Manager / Data Analyst
    start: 2026-02
    end: null                      # null means still there
    location: Remote, France

